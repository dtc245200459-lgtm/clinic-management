# HTTPS chỉ dùng để THỰC HÀNH tại localhost.
# Giữ nginx/default.conf của Bước 6.1 để dự phòng HTTP.
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        # Để nguyên Host kèm cổng :8443 cho Django kiểm tra CSRF.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ghi đè header do client gửi; Django chỉ tin reverse proxy tại localhost.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
