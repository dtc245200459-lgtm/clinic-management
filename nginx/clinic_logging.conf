# Chỉ lưu: thời gian, phương thức HTTP, mã kết quả, độ trễ.
# KHÔNG lưu IP, URI, query string, cookie, form hoặc thông tin bệnh nhân.
# File này được Nginx include bên trong context http.
log_format clinic_privacy '$time_iso8601 method=$request_method status=$status seconds=$request_time';
access_log /var/log/clinic/clinic_access.log clinic_privacy;
