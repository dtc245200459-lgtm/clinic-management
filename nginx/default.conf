# Các log chỉ ghi đường dẫn, không ghi query string (?q=...), tránh lưu tên bệnh nhân khi tìm kiếm.
log_format clinic_local '$remote_addr $request_method $uri $status $request_time';
access_log /var/log/nginx/access.log clinic_local;

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        # Giữ cổng trong Host để Django kiểm tra CSRF cho localhost:8080.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
