# Bước 6.1: bổ sung Nginx, không thay đổi cấu hình web/db hiện có.
# Docker Compose tự đọc file này bên cạnh compose.yaml.
services:
  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
