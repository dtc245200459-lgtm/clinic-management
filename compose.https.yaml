# Bước 6.2: BỔ SUNG vào compose.yaml + compose.override.yaml bằng tùy chọn -f.
# Giữ nguyên dịch vụ db, dữ liệu, cấu hình Gunicorn và HTTP :8081.
services:
  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_https

  nginx:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/https.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
